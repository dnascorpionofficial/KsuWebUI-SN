name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set app version from update.txt
        run: |
          # line 1 of update.txt = app version name (line 2 = version code, read by the app)
          v=$(head -n 1 update.txt | tr -d '\r[:space:]')
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "update.txt line 1 must be the app version, e.g. 1.1"
            exit 1
          fi
          sed -i "s/^val appVersionName = .*/val appVersionName = \"$v\"/" app/build.gradle.kts
          grep -n '^val appVersionName' app/build.gradle.kts

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile=$PWD/'key.jks' >> keystore.properties
            echo '${{ secrets.KEY_STORE }}' | base64 --decode > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease

      - name: Get APK name
        id: apk
        run: |
          f=$(basename app/build/outputs/apk/release/*.apk .apk)
          echo "name=$f" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: actions/upload-artifact@v6
        with:
          name: "${{ steps.apk.outputs.name }}"
          path: "./app/build/outputs/apk/release/*.apk"
          compression-level: 9
